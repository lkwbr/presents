<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#98704d">
<meta name="description" content="A birthday scrapbook for the coolest mom on the block. All our love, Luke, Logan, and Ben."><meta name="referrer" content="strict-origin-when-cross-origin">
<title>The 64th Birthday of Deanne Elaine Weber</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23314879'/%3E%3Cpath d='M16 26C5 19 3 11 8 8c4-2 7 1 8 3 1-2 4-5 8-3 5 3 3 11-8 18' fill='%23f1ce79'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><script src="photos.js" defer></script><script src="music.js" defer></script><script type="module" src="scrapbook.js"></script>
</head><body>
<main>
<div class="book-scene" id="book-scene" aria-label="An interactive birthday scrapbook"><canvas id="book-canvas" role="img" aria-label="A textured birthday scrapbook with handwritten lettering and family Polaroids"></canvas><div id="photo-hotspots" aria-label="Photos on the open pages"></div><div id="flat-album" class="flat-album" hidden></div><nav id="ink-controls" class="ink-controls" aria-label="Turn scrapbook pages" hidden><button id="previous-page" type="button" class="page-turn" aria-label="Previous page" disabled></button><button id="next-page" type="button" class="page-turn" aria-label="Open birthday card" disabled></button></nav><p id="book-loading" class="book-loading" role="status">Opening your card…</p></div>
<span id="page-count" class="sr-only" aria-live="polite">Cover</span>
<div id="page-description" class="sr-only" aria-live="polite"></div>
<div class="sr-only" id="birthday-note">Happy 64th birthday, Mom! We’re the lucky three. We love you. All our love, Luke, Logan, and Ben.</div>
</main>
<button id="music-switch" class="music-switch" type="button" aria-pressed="true" aria-label="Turn music off" title="Autumn Leaves · Nat King Cole"><span aria-hidden="true">♫</span><span id="music-label" class="sr-only">Turn music off</span></button><audio id="card-audio" src="music/autumn-leaves.mp3" preload="metadata" loop></audio><span id="music-status" class="sr-only" role="status"></span>
<dialog id="photo-dialog" class="photo-dialog" aria-label="Family photo viewer"><div class="full-polaroid"><button id="close-photo" class="close-photo" type="button" aria-label="Close photo">×</button><img id="full-photo" alt=""><span id="full-photo-caption" class="full-photo-caption" hidden></span><div class="photo-controls"><button id="previous-photo" type="button" aria-label="Previous photo"></button><span id="photo-count" class="sr-only" aria-live="polite"></span><button id="next-photo" type="button" aria-label="Next photo"></button></div></div></dialog>
<noscript><p class="noscript-note">Happy 64th birthday, Mom! Everyone else wishes they had our mom. We’re the lucky three who actually do. All our love, Luke, Logan, and Ben.</p></noscript>
</body></html>
